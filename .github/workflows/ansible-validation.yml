name: Ansible validation

on:
  pull_request:
    paths:
      - 'ansible/**'
      - 'requirements-dev.txt'
      - '.github/workflows/ansible-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'requirements-dev.txt'
      - '.github/workflows/ansible-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned Ansible tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check Ansible syntax
        run: ansible-playbook --syntax-check ansible/playbooks/ci-smoke.yml

      - name: Lint Ansible playbooks
        run: ansible-lint ansible/playbooks/ci-smoke.yml

      - name: Execute safe localhost smoke test
        run: ansible-playbook ansible/playbooks/ci-smoke.yml
