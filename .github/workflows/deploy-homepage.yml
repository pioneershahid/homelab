name: Deploy Homepage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-homepage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Homepage to homelab
    runs-on: [self-hosted, linux, x64, homelab-smoke]
    timeout-minutes: 15
    env:
      LANG: C.utf8
      LC_ALL: C.utf8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check system Python and pip
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install Ansible tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Verify Ansible is available
        run: |
          .venv/bin/ansible --version
          .venv/bin/ansible-playbook --version

      - name: Verify SSH connectivity to Docker LXC
        run: |
          .venv/bin/ansible \
            -i ansible/inventory/homelab.yml \
            docker_hosts \
            -m ping

      - name: Validate deployment playbook
        run: |
          .venv/bin/ansible-playbook \
            -i ansible/inventory/homelab.yml \
            --syntax-check \
            ansible/playbooks/deploy-homepage.yml

      - name: Deploy Homepage only
        run: |
          .venv/bin/ansible-playbook \
            -i ansible/inventory/homelab.yml \
            ansible/playbooks/deploy-homepage.yml
