name: Deploy Homepage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-homepage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Homepage to homelab
    runs-on: [self-hosted, linux, x64, homelab-smoke]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Ansible is available
        run: |
          /opt/homelab/.venv/bin/ansible --version
          /opt/homelab/.venv/bin/ansible-playbook --version

      - name: Verify SSH connectivity to Docker LXC
        run: |
          /opt/homelab/.venv/bin/ansible \
            -i ansible/inventory/homelab.yml \
            docker_hosts \
            -m ping

      - name: Validate deployment playbook
        run: |
          /opt/homelab/.venv/bin/ansible-playbook \
            -i ansible/inventory/homelab.yml \
            --syntax-check \
            ansible/playbooks/deploy-homepage.yml

      - name: Deploy Homepage only
        run: |
          /opt/homelab/.venv/bin/ansible-playbook \
            -i ansible/inventory/homelab.yml \
            ansible/playbooks/deploy-homepage.yml
