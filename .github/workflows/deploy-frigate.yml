name: Deploy Frigate

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Recreate Frigate container (may interrupt camera monitoring)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-frigate
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frigate to CT 101
    runs-on: [self-hosted, linux, x64, homelab-smoke]
    timeout-minutes: 20
    env:
      LANG: C.utf8
      LC_ALL: C.utf8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ansible environment
        run: |
          python3 --version
          python3 -m pip --version
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Verify SSH access to Frigate
        run: |
          ssh -i /home/runner/.ssh/homepage_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=5 \
            root@192.168.1.30 true

      - name: Validate inventory and playbook
        run: |
          .venv/bin/ansible-inventory \
            -i ansible/inventory/homelab.yml --list > /dev/null

          .venv/bin/ansible frigate_hosts \
            -i ansible/inventory/homelab.yml \
            -m ansible.builtin.ping

          .venv/bin/ansible-playbook \
            -i ansible/inventory/homelab.yml \
            --syntax-check \
            ansible/playbooks/deploy-frigate.yml

      - name: Deploy Frigate
        env:
          FRIGATE_RECREATE: ${{ inputs.recreate }}
        run: |
          .venv/bin/ansible-playbook \
            -i ansible/inventory/homelab.yml \
            ansible/playbooks/deploy-frigate.yml \
            --extra-vars "frigate_recreate=${FRIGATE_RECREATE}"

      - name: Run LAN smoke tests
        run: bash scripts/smoke-test-lan.sh
