---
- name: Preflight every Compose project before batch deployment
  hosts: compose_deploy_hosts
  gather_facts: false
  become: true
  strategy: linear
  any_errors_fatal: true

  vars:
    approve_compose_drift: false

    compose_projects_by_host:
      photos:
        - name: immich
          directory: /root/docker_volumes/immich-app
          live_file: docker-compose.yml
          repo_file: photos/docker-compose.yml

      network:
        - name: authelia
          directory: /root/docker_volumes/authelia
          live_file: docker-compose.yaml
          repo_file: network/authelia/docker-compose.yaml

        - name: traefik
          directory: /root/docker_volumes/traefik
          live_file: docker-compose.yaml
          repo_file: network/traefik/docker-compose.yaml

      servarr:
        - name: servarr
          directory: /root/docker_volumes/servarr
          live_file: docker-compose.yaml
          repo_file: servarr/docker-compose.yaml

      media:
        - name: media
          directory: /root/docker_volumes/mediarr
          live_file: docker-compose.yaml
          repo_file: media/docker-compose.yaml

  tasks:
    - name: Preflight each project on this host
      ansible.builtin.include_tasks: compose-batch-preflight-project.yml
      loop: "{{ compose_projects_by_host[inventory_hostname] }}"
      loop_control:
        loop_var: project


- name: Back up every live Compose file before deployment
  hosts: compose_deploy_hosts
  gather_facts: false
  become: true
  strategy: linear
  any_errors_fatal: true

  vars:
    compose_projects_by_host:
      photos:
        - name: immich
          directory: /root/docker_volumes/immich-app
          live_file: docker-compose.yml
          repo_file: photos/docker-compose.yml
      network:
        - name: authelia
          directory: /root/docker_volumes/authelia
          live_file: docker-compose.yaml
          repo_file: network/authelia/docker-compose.yaml
        - name: traefik
          directory: /root/docker_volumes/traefik
          live_file: docker-compose.yaml
          repo_file: network/traefik/docker-compose.yaml
      servarr:
        - name: servarr
          directory: /root/docker_volumes/servarr
          live_file: docker-compose.yaml
          repo_file: servarr/docker-compose.yaml
      media:
        - name: media
          directory: /root/docker_volumes/mediarr
          live_file: docker-compose.yaml
          repo_file: media/docker-compose.yaml

  tasks:
    - name: Back up this host's live Compose files
      ansible.builtin.copy:
        src: "{{ project.directory }}/{{ project.live_file }}"
        dest: >-
          {{ project.directory }}/{{ project.live_file }}.pre-batch-{{
          lookup('pipe', 'date +%Y%m%d-%H%M%S') }}
        remote_src: true
        mode: preserve
      loop: "{{ compose_projects_by_host[inventory_hostname] }}"
      loop_control:
        loop_var: project
        label: "{{ project.name }}"

- name: Apply the approved Compose configurations
  hosts: compose_deploy_hosts
  gather_facts: false
  become: true
  strategy: linear
  any_errors_fatal: true

  vars:
    compose_projects_by_host:
      photos:
        - name: immich
          directory: /root/docker_volumes/immich-app
          live_file: docker-compose.yml
          repo_file: photos/docker-compose.yml

      network:
        - name: authelia
          directory: /root/docker_volumes/authelia
          live_file: docker-compose.yaml
          repo_file: network/authelia/docker-compose.yaml

        - name: traefik
          directory: /root/docker_volumes/traefik
          live_file: docker-compose.yaml
          repo_file: network/traefik/docker-compose.yaml

      servarr:
        - name: servarr
          directory: /root/docker_volumes/servarr
          live_file: docker-compose.yaml
          repo_file: servarr/docker-compose.yaml

      media:
        - name: media
          directory: /root/docker_volumes/mediarr
          live_file: docker-compose.yaml
          repo_file: media/docker-compose.yaml

  tasks:
    - name: Deploy each approved project
      ansible.builtin.include_tasks: compose-batch-deploy-project.yml
      loop: "{{ compose_projects_by_host[inventory_hostname] }}"
      loop_control:
        loop_var: project
