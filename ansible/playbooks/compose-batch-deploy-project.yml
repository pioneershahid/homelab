---
- name: Install repository Compose file with a backup
  ansible.builtin.copy:
    src: "{{ project.directory }}/.compose-batch-candidate.yaml"
    dest: "{{ project.directory }}/{{ project.live_file }}"
    remote_src: true
    mode: "0644"
    backup: true
  register: compose_install

- name: Apply the Compose project
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ project.directory }}"
      - -f
      - "{{ project.directory }}/{{ project.live_file }}"
      - up
      - -d
  register: compose_up
  changed_when: >-
    compose_install.changed or
    'Created' in compose_up.stdout or
    'Recreated' in compose_up.stdout or
    'Started' in compose_up.stdout

- name: Show deployment result
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}/{{ project.name }} applied successfully"

- name: Remove staged candidate
  ansible.builtin.file:
    path: "{{ project.directory }}/.compose-batch-candidate.yaml"
    state: absent
