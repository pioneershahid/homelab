#        passHostHeader: true

    homepage:
      loadBalancer:
        servers:
          - url: "http://192.168.1.27:3000"
        passHostHeader: true

    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.168.1.2:8123"
        passHostHeader: true

    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.1.31:8096"
        passHostHeader: true


    webapp:
      loadBalancer:
        servers:
          - url: "http://192.168.1.27:8090"
        passHostHeader: true

    immich:
      loadBalancer:
        servers:
          - url: "http://192.168.1.28:2283"
        passHostHeader: true

  serversTransports:
    pve:
      insecureSkipVerify: true

 ## MIDDLEWARES ##
#endregion
  middlewares:

    addprefix-pihole:
      addPrefix:
        prefix: "/admin"

    addprefix-wordpress:
      addPrefix:
        prefix: "/wp-login.php"

    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipAllowList:
        sourceRange:
        - "10.0.0.0/8"
        - "192.168.1.0/24"
        - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers

    authelia:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth?rd=https://auth.shahidmustafa.ie"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Name"
          - "Remote-Email"
  #endregion
