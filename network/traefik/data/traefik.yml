## traefik.yml

# API and dashboard configuration
#api:
#  insecure: true

api:
  dashboard: true
  debug: true
  #insecure: true

entryPoints:
  http:
    address: ':80'
    forwardedHeaders:
      trustedIPs:
        # Your LAN
        - "192.168.1.0/24"

        # Common Docker bridge ranges (adjust to what you actually use)
        - "172.18.0.0/16"

        # Cloudflare (IPv4)
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"

        # Cloudflare (IPv6)
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ':443'
    forwardedHeaders:
      trustedIPs:
        - "192.168.1.0/24"
        - "172.18.0.0/16"

        # Cloudflare IPv4
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"

        # Cloudflare IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

serversTransport:
  insecureSkipVerify: true

log:
  level: DEBUG

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json

providers:
  providersThrottleDuration: 2s

  docker:
   # endpoint: "unix:///var/run/docker.sock"
   # exposedByDefault: false
    watch: true
    network: proxy # Add Your Docker Network Name Here
    # Default host rule to containername.domain.example
    defaultRule: "Host(`{{ index .Labels \"com.docker.compose.service\"}}.shahidmustafa.ie`)"
    exposedByDefault: false
    endpoint: "tcp://dockersocket:2375"

  file:
    filename: /config.yml

certificatesResolvers:
  cloudflare:
    acme:
      email: shahid.mustafa85@outlook.com
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
      #caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging
      dnsChallenge:
        provider: cloudflare
        disablePropagationCheck: true # uncomment this if you have issues pulling certificates through cloudflare, By setting this flag to true disables the need to wait for the propagation of the TXT record to all authoritative name servers.
        delayBeforeCheck: 60s # uncomment along with disablePropagationCheck if needed to ensure the TXT record is ready before verification is attempted
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
#          - "192.168.1.27:53" # removing it as i am not runing local DNS server
